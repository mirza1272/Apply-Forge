{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Create Job - ApplyForge{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-0 shadow-lg animate__animated animate__fadeInUp"
                 style="background: var(--glass-bg); backdrop-filter: blur(12px); color: var(--text-color);">

                <div class="card-header bg-gradient-primary text-white">
                    <h4 class="mb-0 text-center">Create Job Posting</h4>
                </div>

                <div class="card-body p-5">
                    <form method="post">
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'employer_dashboard' %}" class="btn btn-outline-light">
                                <i class="bi bi-arrow-left me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-primary px-4">
                                <i class="bi bi-check2-circle me-1"></i> Create Job
                            </button>
                        </div>
                    </form>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
