{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Update Job - ApplyForge{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">
            <div class="card border-0 shadow-lg rounded-4" data-aos="zoom-in">
                <div class="card-header text-white rounded-top-4" style="background: linear-gradient(to right, #7F00FF, #E100FF);">
                    <h4 class="mb-0">✏️ Update Job Posting</h4>
                </div>
                <div class="card-body p-5">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        {{ form|crispy }}

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'job_detail' form.instance.pk %}" class="btn btn-outline-secondary btn-lg rounded-pill px-4">
                                Cancel
                            </a>
                            <button type="submit" class="btn btn-gradient-purple btn-lg rounded-pill px-4">
                                <i class="bi bi-arrow-repeat me-1"></i> Update Job
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.btn-gradient-purple {
    background: linear-gradient(to right, #7F00FF, #E100FF);
    color: #fff;
    border: none;
}
.btn-gradient-purple:hover {
    background: linear-gradient(to right, #6a00cc, #c400cc);
    color: #fff;
}
</style>
{% endblock %}
