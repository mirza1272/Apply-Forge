{% extends 'base.html' %}
{% load static %}
{% load crispy_forms_tags %}

{% block title %}Login - ApplyForge{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg animate__animated animate__fadeIn" data-aos="fade-up" style="background: var(--glass-bg); backdrop-filter: blur(10px); color: var(--text-color); border-radius: 1rem;">
                <div class="card-header py-4 text-white text-center" style="background: linear-gradient(135deg, var(--primary), var(--primary-hover)); border-top-left-radius: 1rem; border-top-right-radius: 1rem;">
                    <h4 class="mb-0 animate__animated animate__fadeInDown">Welcome Back</h4>
                </div>
                <div class="card-body p-5">
                    <div class="text-center mb-4 animate__animated animate__fadeIn animate__delay-1s">
                        <img src="{% static 'images/login-illustration.png' %}" alt="Login" class="img-fluid" style="max-height: 150px;">
                    </div>
                    <form method="post" class="animate__animated animate__fadeIn animate__delay-2s">
                        {% csrf_token %}
                        {{ form|crispy }}
                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-lg glow-btn" style="background: var(--primary); color: #fff; border-radius: 50px; position: relative; overflow: hidden;">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Login
                                <span class="shine"></span>
                            </button>
                        </div>
                    </form>
                    <div class="mt-4 text-center animate__animated animate__fadeInUp animate__delay-3s">
                        <p class="mb-2">Don't have an account? 
                            <a href="{% url 'register' %}" class="fw-bold" style="color: var(--primary);">Register here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
/* Shiny Button Glow */
.glow-btn {
    box-shadow: 0 0 10px rgba(138, 99, 229, 0.6), 0 0 20px rgba(138, 99, 229, 0.4);
    transition: all 0.3s ease-in-out;
}

.glow-btn:hover {
    box-shadow: 0 0 15px rgba(138, 99, 229, 0.9), 0 0 30px rgba(138, 99, 229, 0.7);
}

/* Shine animation */
.glow-btn .shine {
    content: '';
    position: absolute;
    top: 0;
    left: -75%;
    width: 50%;
    height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.4), transparent);
    transform: skewX(-20deg);
    animation: shineMove 2.5s infinite;
}

@keyframes shineMove {
    0% { left: -75%; }
    50% { left: 125%; }
    100% { left: 125%; }
}
</style>
{% endblock %}
